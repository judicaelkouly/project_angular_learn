<nav class="flex items-center justify-between px-6 md:px-16 lg:px-24 xl:px-32 py-4 border-b border-gray-300 bg-gray-100 relative transition-all">
    <!-- 1. LOGO (Gauche) -->
    <a routerLink="/" class="font-bold text-xl cursor-pointer">
      LOGO
    </a>

    <!-- Bouton Menu Mobile -->
    <button aria-label="Menu" (click)="toggleMenu()" class="sm:hidden cursor-pointer">
        <svg width="21" height="15" viewBox="0 0 21 15" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="21" height="1.5" rx=".75" fill="#426287"/>
            <rect x="8" y="6" width="13" height="1.5" rx=".75" fill="#426287"/>
            <rect x="6" y="13" width="15" height="1.5" rx=".75" fill="#426287"/>
        </svg>
    </button>

    <!-- Menu Déroulant Mobile -->
    @if (isMenuOpen) {
        <div class="absolute top-[60px] left-0 w-full bg-white shadow-md py-4 flex flex-col items-start gap-2 px-5 text-sm sm:hidden z-50">
            <a routerLink="/" class="block py-1">Home</a>
            <a routerLink="/" class="block py-1">About</a>
            <a routerLink="/" class="block py-1">Contact</a>

            <div class="w-full pt-3 mt-2 border-t border-gray-200 flex flex-col gap-2">
                @if (isLoggedIn) {
                    <button routerLink="/profile" class="w-full text-left py-2 text-indigo-600 font-medium cursor-pointer">Mon Compte</button>
                    <button (click)="logout()" class="w-full text-left py-2 text-red-600 font-medium cursor-pointer">
                        Se déconnecter
                    </button>
                } @else {
                    <a routerLink="/login" class="block py-2 font-medium text-gray-700">Se connecter</a>
                    <a routerLink="/register" class="block py-2 text-center bg-indigo-500 text-white rounded-full font-medium">S'inscrire</a>
                }
            </div>
        </div>
    }

    <!-- 2. LIENS DE NAVIGATION (Centre) -->
    <div class="hidden sm:flex items-center gap-8">
        <a routerLink="/" class="hover:text-indigo-600 transition">Home</a>
        <a routerLink="/" class="hover:text-indigo-600 transition">About</a>
        <a routerLink="/" class="hover:text-indigo-600 transition">Contact</a>
    </div>

    <!-- 3. BOUTONS D'ACTION (Droite) -->
    <div class="hidden sm:flex items-center">
        @if (isLoggedIn) {
            <div class="flex items-center gap-4">
                <button routerLink="/profile" class="text-sm font-medium text-gray-700 cursor-pointer">Mon Compte</button>
                <button (click)="logout()" class="cursor-pointer px-4 py-2 border border-red-500 text-red-500 hover:bg-red-50 transition rounded-full text-sm">
                    Déconnexion
                </button>
            </div>
        } @else {
            <div class="flex items-center gap-3">
                <a routerLink="/login" class="text-sm font-semibold text-gray-700 hover:text-indigo-600 transition">
                    Se connecter
                </a>
                <a routerLink="/register" class="text-sm font-semibold px-5 py-2 bg-gray-900 hover:bg-gray-800 text-white rounded-full transition shadow-sm">
                    S'inscrire
                </a>
            </div>
        }
    </div>
</nav>
