<div class="flex items-center m-10 justify-center w-full max-w-80 text-gray-500 font-medium">
    <!-- Bouton Précédent -->
    <button
        (click)="pageClicked(currentPage - 1)"
        [disabled]="currentPage === 1"
        [ngClass]="{'opacity-40 cursor-not-allowed hover:bg-slate-200/50': currentPage === 1}"
        type="button"
        aria-label="prev"
        class="rounded-full bg-slate-200/50 transition-colors">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.499 12.85a.9.9 0 0 1 .57.205l.067.06a.9.9 0 0 1 .06 1.206l-.06.066-5.585 5.586-.028.027.028.027 5.585 5.587a.9.9 0 0 1 .06 1.207l-.06.066a.9.9 0 0 1-1.207.06l-.066-.06-6.25-6.25a1 1 0 0 1-.158-.212l-.038-.08a.9.9 0 0 1-.03-.606l.03-.083a1 1 0 0 1 .137-.226l.06-.066 6.25-6.25a.9.9 0 0 1 .635-.263Z" fill="#475569" stroke="#475569" stroke-width=".078"/>
        </svg>
    </button>

    <!-- Liste des pages -->
    <div class="flex items-center gap-2 text-sm font-medium mx-2">
        @for (page of pages; track page) {
            <a
                (click)="pageClicked(page)"
                href="javascript:void(0)"
                [ngClass]="page === currentPage
                    ? 'bg-indigo-500 text-white border-indigo-500 shadow-sm'
                    : 'text-indigo-500 border border-indigo-200 hover:bg-indigo-50'"
                class="h-10 w-10 flex items-center justify-center aspect-square rounded-full transition-colors">
                {{page}}
            </a>
        }
    </div>

    <!-- Bouton Suivant -->
    <button
        (click)="pageClicked(currentPage + 1)"
        [disabled]="currentPage === totalPages"
        [ngClass]="{'opacity-40 cursor-not-allowed hover:bg-slate-200/50': currentPage === totalPages}"
        type="button"
        aria-label="next"
        class="rounded-full bg-slate-200/50 transition-colors">
        <svg class="rotate-180" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.499 12.85a.9.9 0 0 1 .57.205l.067.06a.9.9 0 0 1 .06 1.206l-.06.066-5.585 5.586-.028.027.028.027 5.585 5.587a.9.9 0 0 1 .06 1.207l-.06.066a.9.9 0 0 1-1.207.06l-.066-.06-6.25-6.25a1 1 0 0 1-.158-.212l-.038-.08a.9.9 0 0 1-.03-.606l.03-.083a1 1 0 0 1 .137-.226l.06-.066 6.25-6.25a.9.9 0 0 1 .635-.263Z" fill="#475569" stroke="#475569" stroke-width=".078"/>
        </svg>
    </button>
</div>
